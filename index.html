<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>창립기념일 2시간 프로그램 Fit Check</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#f6f7fb;color:#171923}
  .wrap{max-width:920px;margin:0 auto;padding:28px 18px 60px}
  .hero{background:white;border-radius:22px;padding:28px;box-shadow:0 10px 35px rgba(0,0,0,.06);margin-bottom:18px}
  .eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.55}
  h1{font-size:30px;line-height:1.25;margin:8px 0 12px}
  .lead{font-size:16px;line-height:1.7;color:#4a5568;margin:0}
  .card{background:white;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 6px 24px rgba(0,0,0,.045)}
  .qtitle{font-size:17px;font-weight:700;line-height:1.5;margin-bottom:14px}
  .scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .scale label{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border:1px solid #e6e8ef;border-radius:12px;cursor:pointer;background:#fff}
  .scale input{accent-color:#111827}
  .scale span{font-size:12px;color:#64748b;text-align:center}
  .meta{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  select{width:100%;padding:12px;border:1px solid #dce0e8;border-radius:12px;background:#fff;font-size:14px}
  .btn{width:100%;border:0;border-radius:14px;padding:15px 18px;font-size:16px;font-weight:800;cursor:pointer;background:#111827;color:white;margin-top:10px}
  .result{display:none;margin-top:18px}
  .result h2{font-size:26px;margin:0 0 8px}
  .badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#eef2ff;font-size:13px;font-weight:700;margin-bottom:10px}
  .bars{margin:18px 0}
  .barrow{margin:12px 0}
  .barlabel{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:6px}
  .track{height:10px;background:#eef0f5;border-radius:999px;overflow:hidden}
  .fill{height:100%;background:#111827;border-radius:999px}
  .agenda{border-top:1px solid #eceef3;margin-top:18px;padding-top:16px}
  .agenda-item{display:grid;grid-template-columns:78px 1fr;gap:12px;padding:9px 0;border-bottom:1px dashed #e6e8ef}
  .time{font-weight:800;font-size:14px}
  .desc{font-size:14px;line-height:1.55;color:#374151}
  .note{font-size:13px;line-height:1.6;color:#64748b;background:#f8fafc;border-radius:12px;padding:12px;margin-top:12px}
  @media(max-width:640px){
    h1{font-size:25px}
    .scale{grid-template-columns:1fr}
    .scale label{flex-direction:row;justify-content:flex-start;padding:10px 12px}
    .meta{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div class="eyebrow">Founder’s Day Session Fit Check</div>
    <h1>우리 조직의 창립기념일 오전 2시간,<br>무엇에 초점을 맞추면 좋을까요?</h1>
    <p class="lead">담당자가 3분 정도 응답하면 <b>강점·시너지 / 리딩·팔로잉 / 조직문화 / 혼합형</b> 중 적합한 방향과 권장 활동 비중을 제안합니다. 정식 조직진단이 아니라 프로그램 설계를 위한 간이 니즈 체크입니다.</p>
  </section>

  <section class="card">
    <div class="meta">
      <div>
        <div class="qtitle">구성원 간 평소 관계</div>
        <select id="rel">
          <option value="1">서로 아직 낯선 편</option>
          <option value="2" selected>친하지만 업무 스타일은 잘 모름</option>
          <option value="3">서로 매우 잘 아는 편</option>
        </select>
      </div>
      <div>
        <div class="qtitle">동료 피드백 공개 방식</div>
        <select id="feedback">
          <option value="1">익명 중심이 안전함</option>
          <option value="2" selected>가벼운 공개 피드백 가능</option>
          <option value="3">직접 피드백도 자연스러움</option>
        </select>
      </div>
    </div>
  </section>

  <div id="questions"></div>
  <button class="btn" onclick="calc()">추천 프로그램 확인하기</button>
  <section id="result" class="card result"></section>
</div>

<script>
const qs = [
 {t:"구성원들이 서로의 강점과 업무 스타일을 생각보다 잘 모른다.", w:{S:3,L:0,O:0}},
 {t:"서로에게 '당신의 강점은 이것'이라고 구체적으로 말해본 경험이 적다.", w:{S:3,L:0,O:0}},
 {t:"업무 상황에 따라 누가 앞서고 누가 지원해야 하는지 역할이 모호할 때가 있다.", w:{S:0,L:3,O:0}},
 {t:"의견 제시, 반대, 질문, 도움 요청을 더 자연스럽게 만들 필요가 있다.", w:{S:0,L:2,O:1}},
 {t:"조직이 성장하면서 예전의 일하는 방식을 한 번 정리할 시점이 왔다.", w:{S:0,L:0,O:3}},
 {t:"우리 조직다운 협업 방식이나 문화에 대해 함께 이야기해본 경험이 적다.", w:{S:0,L:0,O:3}},
 {t:"구성원들이 개인 진단, 카드 선택, 동료 피드백 같은 활동을 재미있어 할 것 같다.", w:{S:2,L:0,O:0}},
 {t:"리더십과 팔로워십을 직급이 아니라 '상황에 따른 역할'로 이해할 필요가 있다.", w:{S:0,L:3,O:0}},
 {t:"강의보다는 움직이고 선택하고 대화하는 참여형 방식이 더 잘 맞는다.", w:{S:0,L:0,O:0,E:3}},
 {t:"창립기념일인 만큼 교육 효과 못지않게 재미와 좋은 분위기가 중요하다.", w:{S:0,L:0,O:0,E:3}},
 {t:"이번 시간을 계기로 팀이 앞으로 지켜볼 한두 가지 행동 약속까지 남겼으면 한다.", w:{S:1,L:1,O:2}},
 {t:"처음 하는 사내 프로그램이므로 무겁거나 평가받는 느낌은 피하고 싶다.", w:{S:1,L:0,O:1,E:1}}
];

const qWrap = document.getElementById("questions");
qs.forEach((q,i)=>{
  const div=document.createElement("section");
  div.className="card";
  div.innerHTML='<div class="qtitle">'+(i+1)+'. '+q.t+'</div><div class="scale">'+
  [1,2,3,4,5].map(v=>'<label><input type="radio" name="q'+i+'" value="'+v+'" '+(v===3?'checked':'')+'><span>'+(v===1?'전혀 아니다':v===2?'아니다':v===3?'보통이다':v===4?'그렇다':'매우 그렇다')+'</span></label>').join('')+
  '</div>';
  qWrap.appendChild(div);
});

const programs = {
 S:{name:"우리 팀 사용설명서 — Strength & Synergy Lab",pitch:"자기인식과 상호이해를 중심으로, '내가 생각하는 나'와 '동료가 경험한 나'를 비교하고 팀의 강점 조합을 발견하는 방식입니다.",agenda:[["0–10분","가벼운 오프닝: 우리 팀을 한 단어로 표현하기"],["10–30분","나의 강점 Quick Pick + 에너지 나는 순간 선택"],["30–50분","동료가 골라주는 나의 강점: 소그룹 또는 QR 익명 피드백"],["50–70분","개인 결과 Reveal: 내가 보는 나 vs 동료가 보는 나"],["70–90분","Team Strength Map: 우리 팀에 많은 강점·부족한 강점 확인"],["90–112분","시너지 미션: 서로 다른 강점을 조합해 짧은 팀 과제 해결"],["112–120분","한 문장 마무리: 앞으로 더 써보고 싶은 나의 강점"]]},
 L:{name:"누가 리드하고 누가 받쳐주는가 — Leading & Following Lab",pitch:"리더와 팔로워를 직급으로 나누기보다, 상황에 따라 앞서고·도전하고·연결하고·실행하는 역할이 바뀐다는 관점으로 풀어가는 참여형 특강입니다.",agenda:[["0–15분","상황 선택 게임: 이럴 때 나는 앞선다 / 따른다 / 질문한다"],["15–35분","미니 특강: 리더십·팔로워십을 '상황 역할'로 다시 보기"],["35–60분","4가지 역할 카드: 방향 제시 / 도전 / 연결 / 실행"],["60–90분","팀 미션 1~2라운드: 제한시간 문제 해결 + 역할 교대"],["90–105분","Debrief: 잘 리드한 순간보다 잘 넘겨준 순간 찾기"],["105–118분","우리 팀의 Lead–Follow 원칙 2가지 만들기"],["118–120분","마무리 한 문장"]]},
 O:{name:"우리가 일하는 방식 — Culture Mini Lab",pitch:"조직문화의 거창한 가치체계보다, 실제로 함께 일할 때 반복되는 행동과 선택을 가볍게 돌아보고 '우리 팀이 계속 가져갈 것과 바꿀 것'을 정합니다.",agenda:[["0–15분","Culture Snapshot: 우리 회사를 세 단어로 표현하기"],["15–35분","미니 특강: 문화는 슬로건보다 반복되는 행동에서 만들어진다"],["35–60분","우리 조직의 좋은 장면 / 답답한 장면 카드 분류"],["60–85분","성장 단계 전환 게임: 예전엔 통했지만 이제는 바꿔야 할 것"],["85–105분","KEEP / TRY / STOP 팀 대화"],["105–117분","우리 팀의 다음 행동 약속 2가지"],["117–120분","마무리"]]},
 H:{name:"TEAM SPARK — Me → We → Us",pitch:"강점·상호이해를 입구로 시작해, 상황별 리딩·팔로잉을 경험하고 마지막에 팀의 협업 약속까지 남기는 혼합형입니다. 창립기념일 오전 2시간에 가장 무리 없이 넣기 좋은 구조입니다.",agenda:[["0–10분","오프닝: 지금 우리 팀의 온도와 키워드"],["10–28분","Me: 나의 강점·업무 에너지 Quick Pick"],["28–48분","We: 동료가 골라주는 나의 강점 + 결과 Reveal"],["48–63분","Team Map: 우리 팀의 강점 조합과 빈칸 보기"],["63–78분","미니 특강: 직급이 아닌 상황의 Leading & Following"],["78–103분","협업 미션: 역할을 바꿔가며 문제 해결"],["103–116분","Us: 우리 팀이 더 잘 뭉치기 위한 KEEP / TRY 1개씩"],["116–120분","서로에게 남기는 한 문장"]]}
};

function calc(){
  let score={S:0,L:0,O:0,E:0}, max={S:0,L:0,O:0,E:0};
  qs.forEach((q,i)=>{
    const v=Number(document.querySelector('input[name="q'+i+'"]:checked').value);
    Object.keys(q.w).forEach(k=>{ score[k]+=v*q.w[k]; max[k]+=5*q.w[k]; });
  });
  let pct={};
  ["S","L","O","E"].forEach(k=>pct[k]=max[k]?Math.round(score[k]/max[k]*100):0);
  const core=[["S",pct.S],["L",pct.L],["O",pct.O]].sort((a,b)=>b[1]-a[1]);
  let key=(core[0][1]-core[1][1] <= 10) ? "H" : core[0][0];
  const p=programs[key];
  const rel=Number(document.getElementById("rel").value);
  const fb=Number(document.getElementById("feedback").value);
  const act=pct.E>=82?"활동 70% / 인사이트 30%":pct.E>=68?"활동 60% / 인사이트 40%":"활동 50% / 인사이트 50%";
  let cautions=[];
  if(fb===1) cautions.push("동료 피드백은 실명 공개보다 익명 QR 또는 3인 소그룹 방식이 안전합니다.");
  if(rel===1) cautions.push("서로 아직 낯설다면 개인적인 피드백보다 관찰 가능한 행동·강점 카드부터 시작하는 편이 좋습니다.");
  if(rel===3 && key==="S") cautions.push("서로 이미 잘 안다면 단순 친밀도 활동보다 '업무에서 실제로 경험한 강점' 사례까지 요구해야 밀도가 높아집니다.");
  if(pct.O>=75) cautions.push("조직문화 니즈가 높더라도 창립기념일 오전에는 문제 진단보다 '앞으로 더 만들고 싶은 행동' 중심으로 마무리하는 것을 권합니다.");
  const labels={S:"강점·상호이해",L:"리딩·팔로잉",O:"조직문화",E:"참여·재미"};
  const result=document.getElementById("result");
  result.innerHTML='<div class="badge">추천 결과</div><h2>'+p.name+'</h2><p class="lead">'+p.pitch+'</p><div class="bars">'+
  ["S","L","O","E"].map(k=>'<div class="barrow"><div class="barlabel"><span>'+labels[k]+'</span><span>'+pct[k]+'%</span></div><div class="track"><div class="fill" style="width:'+pct[k]+'%"></div></div></div>').join("")+
  '</div><div class="note"><b>권장 구성 비중:</b> '+act+'<br>이 결과는 조직 진단 점수가 아니라, 이번 2시간 프로그램에서 어디에 무게를 둘지 정하기 위한 니즈 체크입니다.</div><div class="agenda"><div class="qtitle">추천 120분 흐름</div>'+
  p.agenda.map(x=>'<div class="agenda-item"><div class="time">'+x[0]+'</div><div class="desc">'+x[1]+'</div></div>').join("")+
  '</div>'+(cautions.length?'<div class="note"><b>설계 시 체크</b><br>'+cautions.join("<br>")+'</div>':'');
  result.style.display="block";
  result.scrollIntoView({behavior:"smooth",block:"start"});
}
</script>
</body>
</html>
